name = "conjugacy_diameters_porc_lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ConjugacyDiametersPORC"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# This project does not use mathlib's prescribed copyright/license header.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "ConjugacyDiametersPORC"
